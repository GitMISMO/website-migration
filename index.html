<!DOCTYPE html>
<!--
  Website Migration HQ, resources.mismo.org/website-migration/
  BEFORE UPLOADING A NEW COPY OF THIS FILE: download the current index.html from GitHub first
  and make your changes to that copy. Uploading an older copy silently undoes everything that
  changed since.
  This page must keep data-rs-gate on <html> and RS.requireAccess(...) in startRelay().
  No GitHub token or other secret ever goes in this file. Saving goes through the relay.
-->
<html lang="en" data-rs-gate>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="/assets/session.js"></script>
<title>Website Migration HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --navy:#0d314c; --sky:#74bfeb; --navy-deep:#06202f; --navy-mid:#14486e; --sky-soft:#a9d8f3; --sky-wash:#e4f2fb;
  --ground:#f1f6fa; --surface:#ffffff; --surface-2:#f6fafd; --surface-3:#e9f1f8;
  --border:#d5e2ed; --border-strong:#adc4d6; --rule:#e5eef5;
  --ink:#0d314c; --ink-2:#456179; --ink-3:#7794aa;
  --good:#0f7b5c; --bad:#b3372c; --warn:#a2701a;
  --good-soft:#e2f2ec; --bad-soft:#f9e6e4; --warn-soft:#f8efdc; --info-soft:#e4f2fb;
  --c1:#2477b8; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#008300; --cn:#adc4d6;
  --sunk:var(--surface-2); --line:var(--rule); --accent-soft:var(--sky-wash);
  --display:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --ui:var(--display); --mono:var(--display);
  --shadow:0 1px 2px rgba(13,49,76,.06),0 6px 18px rgba(13,49,76,.06);
  --rail-on:#14486e; --hq-h:64px; --rail-w:240px; --rail-mini:62px;
  color-scheme:light;
}
/* Dark mode: Deep Circuit, the same colours as the Sponsorship Portal and Summit HQ. */
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --ground:#0B1826; --surface:#112336; --surface-2:#172D44; --surface-3:#1D3752;
  --border:#243E5A; --border-strong:#3A5A7C; --rule:#1A3048;
  --ink:#EEF3F8; --navy-mid:#7AB9E1; --ink-2:#B9C8D6; --ink-3:#8C9FB1;
  --sky:#50A4DB; --sky-soft:#94C8E9;
  --good:#72C08E; --bad:#F08579; --warn:#E0A83C;
  --good-soft:#1F3328; --bad-soft:#3D2220; --warn-soft:#3A3020; --info-soft:#173A57; --sky-wash:#173A57;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#2f9e2f; --cn:#3A5A7C;
  --tab-active:#112336; --chip:#1D3752; --overlay:rgba(2,10,16,.62);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --ground:#0B1826; --surface:#112336; --surface-2:#172D44; --surface-3:#1D3752;
  --border:#243E5A; --border-strong:#3A5A7C; --rule:#1A3048;
  --ink:#EEF3F8; --navy-mid:#7AB9E1; --ink-2:#B9C8D6; --ink-3:#8C9FB1;
  --sky:#50A4DB; --sky-soft:#94C8E9;
  --good:#72C08E; --bad:#F08579; --warn:#E0A83C;
  --good-soft:#1F3328; --bad-soft:#3D2220; --warn-soft:#3A3020; --info-soft:#173A57; --sky-wash:#173A57;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#2f9e2f; --cn:#3A5A7C;
  --tab-active:#112336; --chip:#1D3752; --overlay:rgba(2,10,16,.62);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--ground);color:var(--ink);font-family:var(--display);font-size:14px;line-height:1.5;
  font-variant-numeric:tabular-nums;margin:0}
button,input,select,textarea{font-family:inherit}
a{color:var(--c1)}
h1,h2,h3{letter-spacing:-.012em;text-wrap:balance;margin:0}

/* masthead */
.hqtop{position:sticky;top:env(safe-area-inset-top,0px);z-index:97;height:var(--hq-h);
  background:var(--navy);color:#fff;display:flex;align-items:center;gap:0;
  padding:0 22px;box-shadow:0 1px 0 rgba(80,164,219,.28);
  margin-left:calc(0px - var(--rail-w));width:calc(100% + var(--rail-w));
  transition:margin-left .2s cubic-bezier(.4,0,.2,1), width .2s cubic-bezier(.4,0,.2,1)}
body.railmini .hqtop{margin-left:calc(0px - var(--rail-mini));width:calc(100% + var(--rail-mini))}
@media (prefers-reduced-motion:reduce){ .hqtop{transition:none} }
.hqtop .mastrule{display:block;width:2px;height:34px;flex:0 0 auto;margin-inline:20px;border-radius:1px;background:var(--sky)}
.hqtop .hqname{font-family:var(--display);font-size:15.5px;font-weight:700;letter-spacing:-.005em;color:var(--sky);white-space:nowrap}
.hqtop-r{margin-left:auto;display:flex;align-items:center;gap:13px}
.hqtop .eyebrow-m{font-family:var(--display);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:rgba(255,255,255,.62);font-weight:600;white-space:nowrap}
@media(max-width:700px){.hqtop .eyebrow-m{display:none}}
.logoplate{background:#fff;border-radius:7px;padding:8px 14px;display:flex;align-items:center;line-height:0;flex:0 0 auto;position:relative}
.logoplate .wordmark{height:24px;width:auto;display:block}
.santa{position:absolute;display:none;pointer-events:none;left:-9px;top:-12px;width:31px;height:31px}
html[data-season="december"] .santa{display:block}
@media(max-width:520px){.hqtop{padding:0 12px}.hqtop .mastrule{margin-inline:12px}.logoplate{padding:7px 10px}.logoplate .wordmark{height:19px}}

/* rail */
.hq.rail{position:fixed;left:0;top:calc(var(--hq-h) + env(safe-area-inset-top,0px));bottom:0;width:var(--rail-w);z-index:95;
  background:var(--navy);color:#fff;display:flex;flex-direction:column;gap:0;padding:0;overflow:hidden auto;overscroll-behavior:contain;
  box-shadow:1px 0 0 rgba(80,164,219,.22), 4px 0 18px rgba(6,32,47,.14);transition:width .2s cubic-bezier(.4,0,.2,1)}
body{padding-left:var(--rail-w);transition:padding-left .2s cubic-bezier(.4,0,.2,1)}
@media (prefers-reduced-motion:reduce){ .hq.rail,body{transition:none} }
body.railmini{padding-left:var(--rail-mini)}
body.railmini .hq.rail{width:var(--rail-mini)}
body.railmini .rail-top{justify-content:center;padding:10px 0 9px}
body.railmini .rail-lbl{display:none}
body.railmini .railhide{margin:0}
body.railmini .railhide svg{transform:scaleX(-1)}
body.railmini .railfind{padding:9px 0 2px;display:flex;justify-content:center}
body.railmini .railfind .fi, body.railmini .railfind input, body.railmini .railq-x, body.railmini .railhits{display:none}
body.railmini .railfind-b{display:flex}
body.railmini .hq nav{padding:6px 0 4px;align-items:center;gap:4px}
body.railmini .hq nav button{width:42px;padding:10px 0;justify-content:center;border-radius:9px;box-shadow:none}
body.railmini .hq nav button span{display:none}
body.railmini .hq nav button svg{width:19px;height:19px}
body.railmini .hq nav button[aria-current]{background:var(--sky);color:var(--navy-deep,#06202f)}
body.railmini .hq nav button[aria-current] svg{stroke:var(--navy-deep,#06202f);opacity:1}
body.railmini .hq .mast-right{gap:3px;padding:8px 0 11px;align-items:center}
body.railmini .hq .mast-right .theme-btn{width:42px;padding:9px 0;font-size:0;justify-content:center;border-radius:9px}
body.railmini .hq .mast-right .theme-btn .ti{width:19px;height:19px}
body.railmini .hq .mast-right .theme-btn span{display:none}
body.railmini .hq .mast-right #theme-btn{margin-top:4px;padding-top:10px;border-radius:9px}
.railfind-b{display:none;width:34px;height:30px;border:1px solid rgba(255,255,255,.18);border-radius:7px;background:rgba(255,255,255,.08);color:rgba(255,255,255,.8);align-items:center;justify-content:center;padding:0}
.railfind-b svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.railfind-b:hover{background:rgba(255,255,255,.18);color:#fff}
.rail-top{display:flex;align-items:center;gap:8px;padding:11px 10px 9px;border-bottom:1px solid rgba(80,164,219,.2);flex:0 0 auto}
.rail-lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:rgba(255,255,255,.55);padding-left:3px}
.railhide{margin-left:auto;background:transparent;border:1px solid rgba(255,255,255,.18);border-radius:5px;color:rgba(255,255,255,.75);width:24px;height:24px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;padding:0}
.railhide svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.railhide:hover{background:rgba(255,255,255,.14);color:#fff}
.railfind{position:relative;padding:11px 12px 3px;flex:0 0 auto}
.railfind .fi{position:absolute;left:21px;top:20px;width:14px;height:14px;fill:none;stroke:rgba(255,255,255,.5);stroke-width:2;stroke-linecap:round;pointer-events:none}
.railfind input{width:100%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:6px;color:#fff;font:inherit;font-size:12.5px;padding:6px 26px 6px 30px}
.railfind input::placeholder{color:rgba(255,255,255,.5)}
.railfind input:focus{outline:2px solid var(--sky);outline-offset:-1px;background:rgba(255,255,255,.16)}
.railfind input::-webkit-search-cancel-button{display:none}
.railq-x{position:absolute;right:17px;top:16px;width:20px;height:20px;border:0;border-radius:4px;background:transparent;color:rgba(255,255,255,.6);font-size:15px;line-height:1;padding:0}
.railq-x:hover{background:rgba(255,255,255,.16);color:#fff}
.railhits{margin-top:7px;background:var(--surface);border:1px solid var(--border-strong,#adc4d6);border-radius:6px;box-shadow:0 10px 26px rgba(6,32,47,.3);overflow:hidden auto;max-height:min(52vh,420px)}
.railhits .rh-g{font-family:var(--mono);font-size:9px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--ink-3);background:var(--sunk);padding:4px 10px;border-bottom:1px solid var(--line);position:sticky;top:0}
.railhits .rh{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:6px 10px;color:var(--ink);font-family:var(--ui)}
.railhits .rh:last-child{border-bottom:0}
.railhits .rh:hover,.railhits .rh.on{background:var(--accent-soft)}
.railhits .rh b{display:block;font-size:12.5px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.railhits .rh i{display:block;font-style:normal;font-family:var(--mono);font-size:9.5px;letter-spacing:.03em;color:var(--ink-3);margin-top:1px;overflow-wrap:anywhere}
.railhits .rh-none{padding:10px;font-size:12px;color:var(--ink-3)}
.hq nav{display:flex;flex-direction:column;gap:1px;padding:8px 8px 4px;flex:0 0 auto}
.hq nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:6px;color:rgba(255,255,255,.76);padding:8px 10px;font:inherit;font-family:var(--display);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.hq nav button svg{width:17px;height:17px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.hq nav button:hover{color:#fff;background:rgba(255,255,255,.09)}
.hq nav button[aria-current]{color:#fff;font-weight:600;background:var(--rail-on);box-shadow:inset 3px 0 0 var(--sky)}
.hq nav button[aria-current] svg{opacity:1;stroke:var(--sky)}
.hq nav button:focus-visible{outline:2px solid var(--sky);outline-offset:-2px}
.hq .mast-right{margin-top:auto;display:flex;flex-direction:column;align-items:stretch;gap:1px;padding:8px 8px 10px;border-top:1px solid rgba(80,164,219,.2);flex:0 0 auto}
.theme-btn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:6px;color:rgba(255,255,255,.76);padding:8px 10px;font:inherit;font-family:var(--display);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.theme-btn .ti{width:17px;height:17px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.theme-btn .ti-sun{display:none}
:root[data-theme="dark"] .theme-btn .ti-moon{display:none}
:root[data-theme="dark"] .theme-btn .ti-sun{display:block}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .theme-btn .ti-moon{display:none} :root:not([data-theme="light"]) .theme-btn .ti-sun{display:block} }
.theme-btn:hover:not(:disabled){color:#fff;background:rgba(255,255,255,.09)}
.theme-btn:focus-visible{outline:2px solid var(--sky);outline-offset:-2px}
.hq .mast-right #theme-btn{margin-top:5px;padding-top:11px;border-top:1px solid rgba(80,164,219,.18);border-radius:0 0 6px 6px}
.railscrim{position:fixed;inset:0;z-index:94;background:rgba(6,32,47,.42);border:0;padding:0;display:none}
@media(max-width:900px){
  body:not(.railmini){padding-left:var(--rail-mini)}
  body:not(.railmini) .hqtop{margin-left:calc(0px - var(--rail-mini));width:calc(100% + var(--rail-mini))}
  body:not(.railmini) .hq.rail{box-shadow:4px 0 26px rgba(6,32,47,.4)}
  body:not(.railmini) .railscrim{display:block}
}

/* page */
main{padding-inline:28px;padding-block:26px 60px}
@media(max-width:700px){main{padding-inline:16px;padding-block:18px 48px}}
.view{display:flex;flex-direction:column;gap:28px}
.vhead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 20px}
.vhead h1{font-size:24px;font-weight:700}
.vhead p{margin:4px 0 0;color:var(--ink-2)}
.vhead .grow{flex:1 1 320px}
.sect-t{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);margin:0 0 10px}
.box{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:18px 20px}
.muted{color:var(--ink-3)}
.note{font-size:12.5px;color:var(--ink-2)}

/* headline */
.headline{background:var(--navy);color:#fff;border-radius:8px;padding:20px 22px;display:flex;flex-direction:column;gap:14px}
.headline .hl-date{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--sky-soft);margin-bottom:-6px}
.headline .hl-say{font-size:18px;font-weight:600;letter-spacing:-.01em;line-height:1.35}
.headline .hl-say em{font-style:normal;color:var(--sky)}
.headline .hl-say em.hl-late{color:#ffcf73}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media(max-width:900px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:rgba(255,255,255,.07);border:1px solid rgba(116,191,235,.28);border-radius:6px;padding:12px 14px}
.tile b{display:block;font-size:28px;font-weight:700;line-height:1.1;color:#fff}
.tile span{display:block;font-size:12px;color:var(--sky-soft);margin-top:3px}
.tile small{display:block;font-size:11.5px;color:rgba(255,255,255,.6);margin-top:2px}
.tile.warn b{color:#ffcf73}

/* timeline */
.tl{position:relative;height:172px;margin:6px 4px 0}
.tl-bar{position:absolute;left:0;right:0;top:62px;height:20px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.tl-ph{position:absolute;top:0;bottom:0;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:600;color:var(--ink-2);white-space:nowrap;overflow:hidden}
.tl-ph.p1{background:color-mix(in srgb,var(--c1) 22%,transparent)}
.tl-ph.p2{background:color-mix(in srgb,var(--c3) 22%,transparent)}
.tl-ph.p3{background:color-mix(in srgb,var(--c4) 26%,transparent)}
.tl-ph.p4{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--bad) 18%,transparent) 0 6px,transparent 6px 12px)}
.tl-wk{position:absolute;top:106px;font-size:10.5px;color:var(--ink-3);transform:translateX(-50%);white-space:nowrap}
.tl-dot{position:absolute;top:87px;width:12px;height:12px;margin-left:-6px;border-radius:50%;border:2px solid var(--surface);background:var(--ink-3)}
.tl-dot.Meeting{background:var(--c1)} .tl-dot.Deadline{background:var(--bad)} .tl-dot.Milestone{background:var(--good)}
.tl-lab{position:absolute;font-size:11px;line-height:1.25;transform:translateX(-50%);text-align:center;white-space:nowrap;color:var(--ink)}
.tl-lab b{display:block;font-weight:700}
.tl-lab.up{bottom:116px}.tl-lab.dn{top:128px}
.tl-lab::after{content:"";position:absolute;left:50%;border-left:1px dashed var(--border-strong)}
.tl-lab.up::after{top:100%;height:6px}.tl-lab.dn::after{bottom:100%;height:28px}
.tl-today{position:absolute;top:52px;height:52px;border-left:2px solid var(--navy);margin-left:-1px}
:root[data-theme="dark"] .tl-today{border-color:var(--sky)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tl-today{border-color:var(--sky)}}
.tl-today span{position:absolute;top:-16px;left:-18px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
.tl-legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--ink-2);margin-top:4px}
.tl-legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.tl-scroll{overflow-x:auto}
.tl-scroll .tl{min-width:640px}

/* roadmap */
.rm-wrap{position:relative;padding-top:22px}
.rm-bar{display:flex;height:38px;border-radius:5px;overflow:hidden;background:var(--surface-3)}
.rm-seg{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;padding:0 6px;border-right:2px solid var(--surface);min-width:0}
.rm-seg:last-child{border-right:0}
.rm-seg b{font-weight:700}
@media(max-width:760px){.rm-seg span{display:none}}
.rm-today{position:absolute;top:4px;bottom:22px;border-left:2px solid var(--ink);margin-left:-1px}
.rm-today span{position:absolute;top:-2px;left:6px;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);white-space:nowrap}
.rm-ends{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-3);margin-top:5px}
.rm-phases{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:16px}
@media(max-width:1100px){.rm-phases{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){.rm-phases{grid-template-columns:1fr}}
.rm-ph{border:1px solid var(--border);border-radius:6px;padding:12px 14px;background:var(--surface-2);display:flex;flex-direction:column;gap:7px}
.rm-ph.now{border-color:var(--c1);background:var(--info-soft)}
.rm-ph.done{opacity:.72}
.rm-ph h3{font-size:14.5px;font-weight:700;display:flex;gap:9px;align-items:center}
.rm-num{width:24px;height:24px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;flex:0 0 auto;color:var(--ink)}
.rm-dates{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.rm-ph p{margin:0;font-size:12.5px;color:var(--ink-2);line-height:1.45}
.rm-ms{display:flex;flex-direction:column}
.rm-row{display:grid;grid-template-columns:120px 1fr auto;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--rule);font-size:13.5px}
.rm-row:last-child{border-bottom:0}
.rm-row small{display:block;color:var(--ink-3);font-size:12px}
.rm-d{font-weight:600;color:var(--ink);white-space:nowrap}
.rm-r{display:flex;gap:8px;align-items:center;justify-content:flex-end}
.rm-in{font-size:12px;color:var(--ink-2);white-space:nowrap;min-width:78px;text-align:right}
@media(max-width:560px){.rm-row{grid-template-columns:1fr auto}.rm-d{grid-column:1 / -1}}

/* composition bars */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
@media(max-width:1000px){.grid2{grid-template-columns:1fr}}
.stack{display:flex;height:30px;border-radius:4px;overflow:hidden;background:var(--surface-3)}
.stack > div{height:100%;min-width:2px;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;color:#fff;overflow:hidden;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.legend b{color:var(--ink);font-weight:700}
.ownbars{display:flex;flex-direction:column;gap:9px}
.ownbar{display:grid;grid-template-columns:112px 1fr 54px;align-items:center;gap:10px;font-size:13px}
.ownbar .stack{height:18px}
.ownbar .n{text-align:right;color:var(--ink-2);font-size:12px}

/* attention */
.att{display:flex;flex-direction:column}
.att button{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule);padding:9px 2px;color:var(--ink);cursor:pointer;font-size:13.5px}
.att button:last-child{border-bottom:0}
.att button:hover{background:var(--surface-2)}
@media(max-width:560px){.att button{grid-template-columns:1fr auto}.att button > .chip{grid-column:1 / -1;justify-self:start}}
.att .who{font-size:12px;color:var(--ink-2);white-space:nowrap}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:3px;padding:1px 7px;font-size:11.5px;font-weight:600;white-space:nowrap;border:1px solid transparent;line-height:1.6}
.chip i{width:7px;height:7px;border-radius:50%;display:inline-block}
.ch-ns{background:var(--surface-3);color:var(--ink-2)}
.ch-ip{background:var(--info-soft);color:var(--c1)}
.ch-bl{background:var(--bad-soft);color:var(--bad)}
.ch-dn{background:var(--good-soft);color:var(--good)}
.ch-od{background:var(--bad-soft);color:var(--bad)}
.ch-soon{background:var(--warn-soft);color:var(--warn)}
.ch-must{background:var(--navy);color:#fff}
:root[data-theme="dark"] .ch-must{background:var(--sky);color:var(--navy-deep)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ch-must{background:var(--sky);color:var(--navy-deep)}}
.ch-conf{background:var(--warn-soft);color:var(--warn)}
.ch-dec{background:var(--surface-2);border-color:var(--border);color:var(--ink)}

/* cards */
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media(max-width:1100px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:640px){.cards{grid-template-columns:1fr}}
@media(min-width:1280px){.cards.c4{grid-template-columns:repeat(4,minmax(0,1fr))}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px 18px;text-align:left;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);font:inherit}
.card:hover{border-color:var(--border-strong)}
.card:focus-visible{outline:2px solid var(--c1);outline-offset:2px}
.card h3{font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:10px}
.card h3 .arr{color:var(--ink-3);font-weight:500;font-size:18px}
.card p{margin:0;color:var(--ink-2);font-size:13px}
.card .meta{display:flex;flex-wrap:wrap;gap:6px}
.card .stack{height:10px}
.card .big{font-size:26px;font-weight:700;line-height:1}
.card .big small{font-size:13px;font-weight:500;color:var(--ink-2);margin-left:6px}

/* confirm dialog */
.modal{position:fixed;inset:0;z-index:150;background:rgba(6,32,47,.5);display:flex;align-items:center;justify-content:center;padding:16px}
.modal-box{background:var(--surface);color:var(--ink);border:1px solid var(--border-strong);border-radius:8px;box-shadow:0 18px 48px rgba(6,32,47,.35);padding:20px 22px;max-width:460px;width:100%}
.modal-box h2{font-size:17px;font-weight:700}
.modal-box p{margin:6px 0 16px;color:var(--ink-2)}
.modal-acts{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end}

/* view switch and grouped rows */
.tlab{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:5px;overflow:hidden}
.seg button{border:0;border-right:1px solid var(--border-strong);background:var(--surface);color:var(--ink-2);padding:6px 13px;font-size:12.5px;font-weight:600;cursor:pointer}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--surface-2)}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{background:var(--sky);color:var(--navy-deep)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{background:var(--sky);color:var(--navy-deep)}}
.seg button:focus-visible{outline:2px solid var(--c1);outline-offset:-2px}
.card .next{font-size:12.5px;color:var(--ink-2);border-top:1px solid var(--rule);padding-top:9px;margin-top:auto}
.card .next b{color:var(--ink);font-weight:600}
.card .stack{margin-top:2px}
.rgrp{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--surface-3);border-bottom:1px solid var(--rule);font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2)}
.rgrp span{background:var(--surface);border:1px solid var(--border);border-radius:3px;padding:0 6px;font-size:11px;letter-spacing:0;color:var(--ink)}
.view > .legend{margin-top:-14px}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.toolbar label{font-size:12.5px;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
select,input[type=text],input[type=date],input[type=url],input[type=number],textarea{background:var(--surface);color:var(--ink);border:1px solid var(--border-strong);border-radius:4px;padding:6px 8px;font-size:13px;max-width:100%}
select:focus,input:focus,textarea:focus{outline:2px solid var(--c1);outline-offset:-1px}
textarea{width:100%;min-height:64px;resize:vertical;line-height:1.45}
.btn{background:var(--navy);color:#fff;border:1px solid var(--navy);border-radius:4px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer}
.btn:hover{background:#14486e}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--border-strong)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
:root[data-theme="dark"] .btn:not(.ghost):not(.danger){background:var(--sky);color:var(--navy-deep);border-color:var(--sky)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn:not(.ghost):not(.danger){background:var(--sky);color:var(--navy-deep);border-color:var(--sky)}}

/* side panel */
.scrim{position:fixed;inset:0;background:rgba(6,32,47,.4);z-index:98;border:0;padding:0}
.panel{position:fixed;top:calc(var(--hq-h) + env(safe-area-inset-top,0px));right:0;bottom:0;width:min(680px,calc(100vw - 56px));z-index:99;background:var(--ground);
  border-left:1px solid var(--border-strong);box-shadow:-12px 0 32px rgba(6,32,47,.22);display:flex;flex-direction:column;
  transform:translateX(0);transition:transform .22s cubic-bezier(.4,0,.2,1)}
.panel.off{transform:translateX(102%);visibility:hidden}
@media (prefers-reduced-motion:reduce){.panel{transition:none}}
@media(max-width:800px){.panel{width:100vw}}
.ph{display:flex;align-items:flex-start;gap:14px;padding:16px 22px;background:var(--surface);border-bottom:1px solid var(--border)}
.ph h2{font-size:19px;font-weight:700}
.ph p{margin:3px 0 0;color:var(--ink-2);font-size:13px}
.ph .x{margin-left:auto;background:none;border:1px solid var(--border-strong);border-radius:4px;width:32px;height:32px;font-size:18px;color:var(--ink);cursor:pointer;flex:0 0 auto}
.ph .x:hover{background:var(--surface-2)}
.pb{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:16px 22px calc(48px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.pb > *{flex:0 0 auto}
@media(max-width:700px){.ph,.pb{padding-inline:16px}}

/* rows */
.rows{background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.row{border-bottom:1px solid var(--rule)}
.row:last-child{border-bottom:0}
.rh2{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;width:100%;background:none;border:0;text-align:left;padding:10px 14px;color:var(--ink);cursor:pointer;font:inherit;font-size:13.5px}
.rh2:hover{background:var(--surface-2)}
.rh2:focus-visible{outline:2px solid var(--c1);outline-offset:-2px}
.row.open > .rh2{background:var(--sky-wash)}
.rh2 .t{flex:1 1 260px;font-weight:600;min-width:0;overflow-wrap:anywhere}
.rh2 .t small{display:block;font-weight:400;color:var(--ink-3);font-size:12px}
.rh2 .r{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:flex-end}
.rh2 .d{font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.rh2.done .t{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--border-strong)}
.rb{padding:14px 14px 16px;background:var(--surface-2);border-top:1px solid var(--rule)}
.fields{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 16px}
@media(max-width:1100px){.fields{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.fields{grid-template-columns:1fr}}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.w2{grid-column:span 2}.f.w4{grid-column:1 / -1}
@media(max-width:560px){.f.w2{grid-column:auto}}
.f > span{font-size:11.5px;font-weight:600;color:var(--ink-2);letter-spacing:.02em}
.f input[type=text],.f input[type=url],.f select,.f input[type=date]{width:100%}
.f .ro{font-size:13px;color:var(--ink);padding:6px 0;overflow-wrap:anywhere}
.f .chk{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 0}
.rowacts{display:flex;justify-content:flex-end;gap:10px;margin-top:12px;align-items:center}
.rowacts .confirmdel{font-size:12.5px;color:var(--bad)}
.rowacts .unsaved{margin-left:auto;font-size:12.5px;font-weight:600;color:var(--warn)}
.rowacts .unsaved[hidden] + .btn{margin-left:auto}
.btn:disabled{opacity:.42;cursor:not-allowed}
.rgrp-btn{width:100%;border:0;border-top:1px solid var(--rule);cursor:pointer;text-align:left;font-family:inherit}
.rgrp-btn:hover{background:var(--border)}
.rgrp-btn i{margin-left:auto;font-style:normal;letter-spacing:0;text-transform:none;font-weight:600;color:var(--c1)}
.row.flash > .rh2{animation:flash 1.6s ease-out}
@keyframes flash{0%{background:var(--warn-soft)}100%{background:transparent}}
@media (prefers-reduced-motion:reduce){.row.flash > .rh2{animation:none}}
.indent1 .t{padding-left:14px}.indent2 .t{padding-left:28px}.indent3 .t{padding-left:42px}.indent4 .t{padding-left:56px}
.empty{padding:18px;color:var(--ink-3);text-align:center}

/* prose blocks */
.prose{font-size:14px;color:var(--ink)}
.prose p{margin:0 0 10px}
.prose ul,.prose ol{margin:0 0 10px;padding-left:20px}
.prose li{margin:3px 0}
.prose h3{font-size:15px;font-weight:700;margin:6px 0 8px}
.callout{border-left:3px solid var(--c1);background:var(--info-soft);padding:10px 14px;border-radius:0 6px 6px 0;font-size:13.5px}
.callout.warn{border-color:var(--warn);background:var(--warn-soft)}
.callout.bad{border-color:var(--bad);background:var(--bad-soft)}
.agenda{list-style:none;padding:0;margin:0;display:flex;flex-direction:column}
.agenda li{display:grid;grid-template-columns:62px 1fr;gap:12px;padding:9px 0;border-bottom:1px solid var(--rule)}
.agenda li:last-child{border-bottom:0}
.agenda li b{font-weight:700;color:var(--c1)}
.status-bar{font-size:12.5px;color:var(--ink-3)}
.offline{padding:28px;text-align:center;color:var(--ink-2)}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:8px 14px;border-radius:5px;font-size:13px;z-index:200;box-shadow:var(--shadow)}
.lk{background:none;border:0;padding:0;color:var(--c1);cursor:pointer;font:inherit;text-decoration:underline}
.hq nav button{position:relative}
.navbadge{margin-left:auto;box-sizing:border-box;width:20px;height:20px;padding:0;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;text-align:center;font-family:var(--display);font-size:11.5px;font-weight:700;line-height:1;background:#e0a83c;color:#0d314c;font-variant-numeric:tabular-nums}
.navbadge.w2{width:26px}.navbadge.w3{width:32px}
.navbadge i{display:block;font-style:normal;line-height:1;text-box:trim-both cap alphabetic}
.navbadge.late{background:#d8453a;color:#fff}
.navbadge[hidden]{display:none!important}
body.railmini .hq nav button .navbadge{position:absolute;top:2px;right:0;width:17px;height:17px;padding:0;font-size:10px;box-shadow:0 0 0 2px var(--navy,#0d314c)}
body.railmini .hq nav button .navbadge.w2{width:22px;right:-3px}body.railmini .hq nav button .navbadge.w3{width:27px;right:-6px}
.panel{transition:transform .22s cubic-bezier(.4,0,.2,1),width .22s cubic-bezier(.4,0,.2,1)}
.panel.wide{width:min(1320px,calc(100vw - var(--rail-w) - 24px))}
body.railmini .panel.wide{width:min(1320px,calc(100vw - var(--rail-mini) - 24px))}
.pb{container-type:inline-size}
@container (max-width:900px){.fields{grid-template-columns:repeat(2,minmax(0,1fr))}}
@container (max-width:480px){.fields{grid-template-columns:1fr}.f.w2{grid-column:auto}}
.ph .x.wide-b{margin-left:auto;display:inline-flex;align-items:center;justify-content:center;padding:0;border-color:transparent;color:var(--ink-3)}
.ph .x.wide-b:hover{color:var(--ink);background:var(--sky-wash);border-color:var(--sky)}
.ph .x.wide-b + .x{margin-left:-8px}
.ph .x.wide-b svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ph .x.wide-b .i-min{display:none}
.panel.wide .ph .x.wide-b .i-max{display:none}
.panel.wide .ph .x.wide-b .i-min{display:block}
@media(max-width:800px){.ph .x.wide-b{display:none}.ph .x.wide-b + .x{margin-left:auto}.panel.wide,body.railmini .panel.wide{width:100vw}}
@media (prefers-reduced-motion:reduce){.panel{transition:none}}
.rh2 .t small .hiflag{display:inline;white-space:nowrap;color:var(--warn);font-weight:700}
.rh2 .t small .hiflag svg{width:12px;height:12px;vertical-align:-1px;margin-right:4px;fill:currentColor;fill-opacity:.25;stroke:currentColor;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.rh2 .t small .sep{margin:0 6px;color:var(--ink-3)}
.cards > .card{display:grid;grid-row:span 3;grid-template-rows:subgrid;row-gap:10px;align-content:start}
.card .cfoot{display:flex;flex-direction:column;gap:10px;align-self:start;min-width:0}
.card .numrow{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;min-height:28px}
.card .numrow .big{flex:0 0 auto;white-space:nowrap}
.card .numrow .meta{justify-content:flex-end;margin-left:auto}
.card .cfoot .next{margin-top:0}
.navphase{margin-left:auto;display:inline-flex;align-items:center;gap:6px;height:20px;padding:0 8px;border-radius:10px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.07);color:#fff;font-family:var(--display);font-size:11px;font-weight:600;line-height:1}
.navphase span{display:block;line-height:1;text-box:trim-both cap alphabetic}
.navphase i{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.hq nav button[aria-current] .navphase{border-color:rgba(116,191,235,.55)}
body.railmini .hq nav button .navphase{display:none}
.rh2 .t small.wline b{color:var(--ink);font-weight:600}

/* sign-in, access and connection notices (resources.mismo.org) */
#rs-account{display:flex;align-items:center}
.relay-banner{margin:0 0 14px;padding:10px 14px;border-radius:6px;border:1px solid var(--border-strong);background:var(--info-soft);color:var(--ink);font-size:13.5px}
.relay-banner.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--ink)}
.access-note{display:flex;align-items:center;gap:8px;margin:0 0 14px;padding:8px 12px;border-radius:6px;background:var(--surface-2);border:1px solid var(--rule);color:var(--ink-2);font-size:13px}
.access-note svg{width:15px;height:15px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ro-note{font-size:12.5px;color:var(--ink-3);margin-left:auto}
.f .ro a{color:var(--navy-mid);word-break:break-all}
</style>

</head>

<aside class="hq rail" id="rail">

try{ const u=JSON.parse(localStorage.getItem(UI_KEY)||'{}'); if(u.owner!=null) UI.owner=u.owner; if(u.showDone!=null) UI.showDone=u.showDone; if(u.view) Object.assign(UI.view,u.view); if(u.confOnly!=null) UI.confOnly=u.confOnly; if(u.mustOnly!=null) UI.mustOnly=u.mustOnly; if(u.mustConf!=null) UI.mustConf=u.mustConf; if(u.wide!=null) UI.wide=u.wide; }catch(e){}

/* ---------- derived ---------- */
function isOverdue(t){ const d=pd(t.due); return d && t.status!=='Done' && d<todayD(); }
function dueSoon(t,n){ const d=pd(t.due); if(!d||t.status==='Done') return false; const k=days(todayD(),d); return k>=0 && k<=(n||7); }
function findDate(re){ return S.dates.find(d=>re.test(d.title||'')); }

/* ---------- chips ---------- */
const TCLS={'Not Started':'ch-ns','In Progress':'ch-ip','Blocked':'ch-bl','Done':'ch-dn'};
const PCLS={'Not Started':'ch-ns','In Progress':'ch-ip','Built':'ch-soon','Verified':'ch-dn'};
const chip=(cls,txt)=>'<span class="chip '+cls+'">'+esc(txt)+'</span>';
const decChip=d=>d?'<span class="chip ch-dec"><i style="background:'+(DEC_C[d]||'var(--cn)')+'"></i>'+esc(d)+'</span>':'';
function dueChip(t){
  if(!t.due) return '<span class="d">No Date</span>';
  if(t.status==='Done') return '<span class="d">'+fmt(t.due)+'</span>';
  if(isOverdue(t)) return chip('ch-od','Overdue · '+fmt(t.due));

  return '<span class="d">Due '+fmt(t.due)+'</span>';
}

  const tot=total||parts.reduce((a,p)=>a+p.v,0)||1;

}

/* ---------- fields ---------- */
function F(c,id,f,label,type,val,o){
  o=o||{}; { const dk=c+'/'+id; if(DRAFT[dk]&&Object.prototype.hasOwnProperty.call(DRAFT[dk],f)) val=DRAFT[dk][f]; } const w=o.w?' '+o.w:'';

    else if(type==='sel') shown=esc(val||o.blank||'—');

function phases(){
  const DAY=864e5;
  const g=(re,fb)=>{ const x=findDate(re); return x&&pd(x.date)?pd(x.date):fb; };
  const p1=g(/phase 1 complete/i,new Date(2026,10,8)), live=g(/goes live/i,new Date(2026,10,12)),
        full=g(/fully migrated/i,new Date(2026,10,15)), close=g(/old website closes/i,new Date(2026,10,22));
  const nx=d=>new Date(d.getTime()+DAY);
  const PH=[
    {n:'Decide What Moves',s:'Decide',a:new Date(2026,8,26),b:new Date(2026,9,2),c:'var(--c1)',what:'The Oct 1 and 2 team meetings settle what moves now, what moves later and what retires.'},
    {n:'Build Phase 1',s:'Build Phase 1',a:new Date(2026,9,3),b:p1,c:'var(--c3)',what:'Membership, IIF, Certifications, Education, the Summit, About and Legal are built and checked, finishing '+fmt(fmtISO(p1))+'.'},
    {n:'Launch the New Website',s:'Launch',a:nx(p1),b:full,c:'var(--c4)',what:'mismo.org points to the new site on '+fmt(fmtISO(live))+'. Everything is moved by '+fmt(fmtISO(full))+'.'},
    {n:'Close Out the Old Website',s:'Close Out',a:nx(full),b:close,c:'var(--c5)',what:'Last week to copy anything left behind. Access to the old site ends '+fmt(fmtISO(close))+'.'}];
  return {PH,close,live,full,p1,nx};
}
function timeline(){
  const t0=todayD();
  const {PH,close,live,full,p1,nx}=phases();
  const A=PH[0].a, B=nx(close), span=Math.max(1,days(A,B));
  const pos=d=>Math.max(0,Math.min(100,days(A,d)/span*100));
  let nextSet=false;
  const st=p=>{ if(t0>p.b) return {k:'done',l:'Done'}; if(t0>=p.a) return {k:'now',l:'Happening Now'};
    const n=days(t0,p.a); const r={k:nextSet?'later':'next',l:'Starts in '+n+(n===1?' Day':' Days')}; nextSet=true; return r; };
  let h='<div class="rm-wrap"><div class="rm-bar">'+PH.map((p,i)=>'<div class="rm-seg" style="width:'+(pos(nx(p.b))-pos(p.a))+'%;background:color-mix(in srgb,'+p.c+' 30%,var(--surface))" title="'+esc(p.n+': '+fmt(fmtISO(p.a))+' to '+fmt(fmtISO(p.b)))+'"><b>'+(i+1)+'</b><span>'+esc(p.s)+'</span></div>').join('')+'</div>';
  if(t0>=A&&t0<B) h+='<span class="rm-today" style="left:'+pos(t0)+'%"><span>Today</span></span>';
  h+='<div class="rm-ends"><span>'+fmt(fmtISO(A))+'</span><span>'+fmt(fmtISO(close))+'</span></div></div>';
  h+='<div class="rm-phases">'+PH.map((p,i)=>{ const s=st(p);
    return '<div class="rm-ph '+s.k+'"><h3><span class="rm-num" style="background:color-mix(in srgb,'+p.c+' 30%,var(--surface))">'+(i+1)+'</span>'+esc(p.n)+'</h3>'+
      '<div class="rm-dates">'+fmt(fmtISO(p.a))+' to '+fmt(fmtISO(p.b))+'</div>'+
      '<span class="chip '+({done:'ch-dn',now:'ch-ip',next:'ch-soon',later:'ch-ns'}[s.k])+'" style="align-self:flex-start">'+s.l+'</span>'+
      '<p>'+esc(p.what)+'</p></div>'; }).join('')+'</div>';
  // key dates coming up
  const up=[...S.dates].filter(x=>pd(x.date)&&pd(x.date)>=t0).sort((a,b)=>a.date.localeCompare(b.date));
  const seenMeet={}; const list=up.filter(x=>{ if(x.kind!=='Meeting') return true; const k=/team/i.test(x.title)?'team':'hl'; if(seenMeet[k]) return false; seenMeet[k]=1; return true; }).slice(0,8);
  if(list.length){
    h+='<h3 class="sect-t" style="margin:22px 0 6px">Coming Up</h3><div class="rm-ms">'+list.map(x=>{ const n=days(t0,pd(x.date));
      const when=n===0?'Today':n===1?'Tomorrow':'In '+n+' Days';
      const kc={Meeting:'ch-ip',Deadline:'ch-od',Milestone:'ch-dn'}[x.kind]||'ch-ns';
      return '<div class="rm-row"><span class="rm-d">'+fmt(x.date,true)+'</span><span><b>'+esc(x.title)+'</b><small>'+esc(x.detail||'')+'</small></span><span class="rm-r">'+chip(kc,x.kind||'Meeting')+'<span class="rm-in">'+when+'</span></span></div>'; }).join('')+'</div>';
  }
  return h;
}

function recordDraft(el){ const k=el.dataset.c+'/'+el.dataset.id; const v=el.dataset.t==='bool'?el.checked:el.value;

  if(String(cur==null?'':cur)===String(v)) { delete DRAFT[k][el.dataset.f]; if(!Object.keys(DRAFT[k]).length&&!isTemp(k)) delete DRAFT[k]; }
  const row=el.closest('.row'); if(!row) return; const d=!!DRAFT[k];
  row.querySelectorAll('[data-save],[data-discard]').forEach(b=>b.disabled=!d); const u=row.querySelector('.unsaved'); if(u) u.hidden=!d;
  const r=row.querySelector(':scope > .rh2 .r'); if(r){ const c=r.querySelector('.chip.ch-conf.unsv'); if(d&&!c) r.insertAdjacentHTML('afterbegin','<span class="chip ch-conf unsv">Unsaved</span>'); if(!d&&c) c.remove(); } }

/* ---------- saving: the resources.mismo.org relay ----------
   This page lives at resources.mismo.org/website-migration/ and keeps its records in the
   PRIVATE GitHub repo GitMISMO/website-migration-data, reached only through MISMO's save
   relay under the project key "website-migration". Signing in is the shared
   resources.mismo.org sign-in (/assets/session.js). The relay decides on every request
   whether the signed-in person has a role here; this page only shows or hides controls.

   Each collection is one JSON file in data/ (the relay has no "list a folder" route):
      data/tasks.json  data/pages.json  data/dates.json  data/decisions.json  data/words.json
   each shaped {docs:{<id>:{...}}}. Every save sends the version (sha) it last read. If
   someone else saved in between, the relay answers 409; the page re-reads, re-applies ITS
   OWN change on top, and saves again, so two people editing different records never
   overwrite each other. Ported from the Sponsorship Portal (September 2026). */
const RELAY_URL='https://rgvdi67cg27o5kcmiytcqbqnrm0hmztx.lambda-url.us-east-1.on.aws';
const RELAY_PROJECT='website-migration';
const TOOL_NAME='Website Migration HQ';
const EYEBROW='Programs & Operations';
const POLL_MS=20000;
const COLLS=['tasks','pages','dates','decisions','words'];
const RS=window.ResourcesSession||null;
const ID_PREFIX={tasks:'t',pages:'p',dates:'d',decisions:'q',words:'w'};

function relayBanner(html,tone){ const b=document.getElementById('conn-banner'); if(!b) return;
  b.className='relay-banner'+(tone?' '+tone:''); b.innerHTML=html; b.hidden=false; }

function relayDb(){
  const files={};
  function file(name){ return files[name]||(files[name]={data:null,sha:null,loaded:false,listeners:[],queue:Promise.resolve(),saving:0,saves:0}); }
  /* A save made after the session has run out asks the person to sign in through the shared
     window ("Sign in to finish saving") and then sends the SAME save. Reads never prompt, so a
     background refresh never opens a window by itself. */
  function call(method,name,body,retried){
    const tok=RS&&RS.token(), write=method!=='GET';
    if(!tok){
      if(!write||!RS||retried) return Promise.reject({code:'SIGNED_OUT'});
      return askToFinish().then(()=>call(method,name,body,true));
    }
    return fetch(RELAY_URL+'/'+RELAY_PROJECT+'/data/'+name,{
      method, cache:'no-store',
      headers:Object.assign({'Authorization':'Bearer '+tok},body?{'Content-Type':'application/json'}:{}),
      body:body?JSON.stringify(body):undefined
    }).then(r=>r.json().catch(()=>({})).then(b=>{
      if(r.ok) return b;
      const err={status:r.status,code:(b&&b.error)||('HTTP_'+r.status),message:b&&b.message};
      if(r.status===401&&RS&&write&&!retried) return askToFinish().then(()=>call(method,name,body,true));
      throw err;
    }));
  }
  function askToFinish(){
    return RS.signIn({reason:'expired'}).then(null,()=>{
      relayBanner('<b>Your change wasn’t saved.</b> Sign in to save it. It stays on screen until you reload.','bad');
      return Promise.reject({code:'SIGNED_OUT'});
    });
  }
  function clean(c){ c=c&&typeof c==='object'?c:{}; return {docs:(c.docs&&typeof c.docs==='object')?c.docs:{}}; }
  function notify(f){ f.listeners.forEach(fn=>{ try{ fn(); }catch(e){} }); }
  /* A background re-read that started before one of this screen's saves can arrive after it,
     carrying the file as it was. It is ignored if a save is in progress or finished while it
     was out; the next one, 20 seconds later, catches up. Loads made by a save (after a
     conflict) pass force and are always believed. */
  function load(name,force){
    const f=file(name), saves0=f.saves;
    return call('GET',name).then(b=>{
      if(!force&&f.loaded&&(f.saving>0||f.saves!==saves0)) return f;
      const changed=!f.loaded||b.sha!==f.sha;
      f.data=clean(b.data); f.sha=b.sha||null; f.loaded=true;
      if(changed) notify(f);
      return f;
    });
  }
  /* One save at a time per file, each re-applying its own change after a conflict. */
  function mutate(name,fn){
    const f=file(name); f.saving++;
    const job=f.queue.then(function attempt(tries){
      tries=tries||0;
      const ready=f.loaded?Promise.resolve(f):load(name,true);
      return ready.then(()=>{
        const next=clean(JSON.parse(JSON.stringify(f.data||{})));
        const out=fn(next);
        return call('PUT',name,{content:next,sha:f.sha}).then(b=>{
          f.data=next; f.sha=b.sha; f.saves++; notify(f); return out;
        },err=>{
          if(err&&err.status===409&&tries<4) return load(name,true).then(()=>attempt(tries+1));
          throw err;
        });
      });
    });
    job.then(()=>{ f.saving--; },()=>{ f.saving--; });
    f.queue=job.catch(()=>{});
    return job;
  }
  function snap(f){ const docs=f.data&&f.data.docs?f.data.docs:{};
    return {docs:Object.keys(docs).map(id=>({id,data:()=>docs[id]}))}; }
  /* New ids follow the ones already there (t056 after t055), worked out on the copy being
     saved, so two people adding at the same moment still get different ids. */
  function nextId(name,docs){ const pre=ID_PREFIX[name]||'x';
    let n=0; Object.keys(docs).forEach(k=>{ const m=new RegExp('^'+pre+'(\\d+)$').exec(k); if(m) n=Math.max(n,+m[1]); });
    let id; do{ n++; id=pre+String(n).padStart(3,'0'); }while(docs[id]); return id; }
  return {
    collection(name){ return {
      onSnapshot(cb,errCb){
        const f=file(name);
        f.listeners.push(()=>cb(snap(f)));
        load(name).catch(e=>{
          if(e&&e.status===404){ f.data=clean(null); f.loaded=true; cb(snap(f)); missingFile(name); return; }
          if(errCb) errCb(e);
        });
      },
      add(obj){ return mutate(name,d=>{ const id=nextId(name,d.docs); d.docs[id]=obj; return {id}; }); }
    }; },
    doc(path){ const [name,id]=String(path).split('/'); return {
      set(obj){ return mutate(name,d=>{ d.docs[id]=obj; }); },
      /* Never brings back a record someone else deleted in the meantime. */
      update(patch){ return mutate(name,d=>{ if(!d.docs[id]) throw {code:'GONE'}; d.docs[id]=Object.assign({},d.docs[id],patch); }); },
      delete(){ return mutate(name,d=>{ delete d.docs[id]; }); }
    }; },
    /* The relay has no push, so everyone's screen catches up by re-reading every 20 seconds.
       A file only re-renders when its version actually changed. */
    poll(){ Object.keys(files).forEach(n=>{ if(files[n].loaded) load(n).catch(()=>{}); }); }
  };
}
const missing={};
function missingFile(name){ missing[name]=1;
  const list=Object.keys(missing).map(n=>'data/'+n+'.json').join(' and ');
  relayBanner('<b>Some of the tracker’s saved records weren’t found.</b> The data store has no '+esc(list)+', so parts of this page show nothing. Don’t enter anything until the records are put back. Tell Jonna.','bad'); }

let started=false;
/* Signing in and being refused use the shared screens every resources.mismo.org tool uses
   (session.js). requireAccess also asks the relay before refusing, so someone granted access
   after they signed in is asked to sign in again rather than turned away. */
function startRelay(){
  RS.requireAccess(RELAY_PROJECT,{toolName:TOOL_NAME,eyebrow:EYEBROW}).then(beginRelay,e=>{
    if(e&&e.code==='OFFLINE') relayBanner('<b>Website Migration HQ couldn’t reach the sign-in service.</b> Check your connection, then reload the page.','bad');
  });
}
function beginRelay(role){
  const sess=RS.current()||{};
  ROLE=role; ME=whoOnList(sess); ME_NAME=sess.name||sess.email||'';
  if(started){ render(); return; }
  started=true;
  const d=relayDb(); db=d;
  COLLS.forEach(c=>{
    d.collection(c).onSnapshot(snap=>{
      S[c]=snap.docs.map(x=>Object.assign({id:x.id},x.data())).concat(TEMP[c]||[]).sort((a,b)=>(a.order||0)-(b.order||0));
      loaded[c]=true; if(Object.values(loaded).every(Boolean)) dbState='on'; render();
    },e=>{
      if(e&&e.code==='NO_ACCESS'){ RS.signIn({reason:'no-access',toolName:TOOL_NAME,eyebrow:EYEBROW,gated:true}).catch(()=>{}); return; }
      dbState='off'; render();
    });
  });
  setInterval(()=>{ if(!document.hidden) d.poll(); },POLL_MS);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) d.poll(); });
}
if(RS){
  RS.mount(document.getElementById('rs-account'));
  RS.onChange(s=>{ if(!s){ location.reload(); return; } startRelay(); });   // signed out: drop everything on screen
  startRelay();
} else {
  dbState='off'; render();
  relayBanner('<b>The sign-in couldn’t load.</b> Reload the page. If it keeps happening, the page isn’t being opened from resources.mismo.org.','bad');
}
})();
</script>

<script>
(function(){
  "use strict";
  const KEY='resources:website-migration:rail';
  const rail=()=>document.getElementById('rail');

  function set(off, remember){
    document.body.classList.toggle('railmini', !!off);
    const h=document.getElementById('rail-hide');
    if(h){ h.setAttribute('aria-expanded', off?'false':'true');
      h.setAttribute('aria-label', off?'Open the menu':'Narrow the menu');
      h.title = (off?'Open the menu':'Narrow the menu')+' (backslash)'; }
    if(off) close();
    if(remember!==false){ try{ localStorage.setItem(KEY, off?'1':'0'); }catch(e){} }
    setTimeout(()=>{ window.dispatchEvent(new Event('resize')); }, 230);
  }
  function toggle(){ set(!document.body.classList.contains('railmini')); }

  function start(){
    let off=null;
    try{ const v=localStorage.getItem(KEY); if(v!==null) off=(v==='1'); }catch(e){}
    if(off===null) off = window.matchMedia('(max-width:900px)').matches;
    set(off, false);
    const h=document.getElementById('rail-hide'); if(h) h.addEventListener('click',toggle);
    const sc=document.getElementById('rail-scrim'); if(sc) sc.addEventListener('click',()=>set(true));
    const qb=document.getElementById('rail-qb');
    if(qb) qb.addEventListener('click',()=>{ set(false);
      setTimeout(()=>{ const q=document.getElementById('rail-q'); if(q) q.focus(); },230); });
    document.querySelectorAll('.hq nav button[data-hq]').forEach(b=>{
      b.addEventListener('click',()=>{
        if(window.matchMedia('(max-width:900px)').matches) set(true);
      });
    });
    wireFind();
  }

  document.addEventListener('keydown',e=>{
    const t=e.target;
    const typing = t && (t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable);
    if(e.key==='\\' && !typing && !e.metaKey && !e.ctrlKey && !e.altKey){ e.preventDefault(); toggle(); }
    if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){
      e.preventDefault(); set(false);
      setTimeout(()=>{ const q=document.getElementById('rail-q');
        if(q){ q.focus(); q.select(); } }, 230);
    }
  });

  const HITS=()=>document.getElementById('rail-hits');
  let picked=-1, rows=[];
  function norm(x){ return String(x||'').replace(/\s+/g,' ').trim().toLowerCase(); }

  function gather(q){
    const t=norm(q); if(t.length<2) return [];
    const out=[];
    const score=(name)=>{ const n=norm(name);
      return n===t ? 3 : n.indexOf(t)===0 ? 2 : n.indexOf(t)>=0 ? 1 : 0; };
    const push=(group,name,where,go)=>{
      if(out.length<60) out.push({group,name,where,go,s:score(name)});
    };

    try{ if(window.__wmFind) window.__wmFind(t,push,norm); }catch(e){}

    const best={};
    out.forEach(h=>{ best[h.group]=Math.max(best[h.group]||0, h.s); });
    const ORDER=['Tasks','Pages','Decisions','Key Dates'];
    out.sort((a,b)=>
      (best[b.group]-best[a.group])
      || (ORDER.indexOf(a.group)-ORDER.indexOf(b.group))
      || (b.s-a.s)
      || String(a.name).localeCompare(String(b.name)));
    return out;
  }
  function go(tab){
    const b=document.querySelector('.hq nav button[data-hq="'+tab+'"]');
    if(b && !b.hasAttribute('aria-current')) b.click();
  }

  function draw(list){
    const box=HITS(); if(!box) return;
    box.textContent=''; rows=[]; picked=-1;
    if(!list.length){
      const n=document.createElement('div'); n.className='rh-none';
      n.textContent='Nothing matches.'; box.appendChild(n); box.hidden=false; return;
    }
    let g=null;
    list.slice(0,24).forEach(h=>{
      if(h.group!==g){ g=h.group;
        const hd=document.createElement('div'); hd.className='rh-g'; hd.textContent=g; box.appendChild(hd); }
      const b=document.createElement('button'); b.type='button'; b.className='rh';
      const nm=document.createElement('b'); nm.textContent=h.name; b.appendChild(nm);
      if(h.where){ const w=document.createElement('i'); w.textContent=h.where; b.appendChild(w); }
      b.addEventListener('click',()=>{ close(); h.go(); });
      rows.push(b); box.appendChild(b);
    });
    box.hidden=false;
  }
  function close(){ const b=HITS(); if(b){ b.hidden=true; b.textContent=''; } rows=[]; picked=-1; }
  function mark(){ rows.forEach((r,i)=>r.classList.toggle('on', i===picked));
    if(rows[picked]) try{ rows[picked].scrollIntoView({block:'nearest'}); }catch(e){} }

  function wireFind(){
    const q=document.getElementById('rail-q'), x=document.getElementById('rail-qx');
    if(!q) return;
    let tmr=null;
    const run=()=>{ const v=q.value;
      if(x) x.hidden = !v;
      if(norm(v).length<2){ close(); return; }
      draw(gather(v)); };
    q.addEventListener('input',()=>{ clearTimeout(tmr); tmr=setTimeout(run,150); });
    q.addEventListener('focus',()=>{ if(norm(q.value).length>=2) run(); });
    q.addEventListener('keydown',e=>{
      if(e.key==='Escape'){ close(); q.blur(); return; }
      if(!rows.length) return;
      if(e.key==='ArrowDown'){ e.preventDefault(); picked=(picked+1)%rows.length; mark(); }
      else if(e.key==='ArrowUp'){ e.preventDefault(); picked=(picked-1+rows.length)%rows.length; mark(); }
      else if(e.key==='Enter'){ e.preventDefault(); (rows[picked]||rows[0]).click(); }
    });
    if(x) x.addEventListener('click',()=>{ q.value=''; x.hidden=true; close(); q.focus(); });
    document.addEventListener('click',e=>{
      if(!e.target.closest('.railfind')) close();
    });
  }

  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',start);
  else start();
  window.__rail={ show:()=>set(false), hide:()=>set(true), toggle,
    mini:()=>document.body.classList.contains('railmini') };
})();
</script>
<script>
(function theme(){

  if(!btn) return;
  function cur(){
    var t = document.documentElement.getAttribute("data-theme");
    if(t) return t;
    return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  function paint(){
    const dark = cur() === "dark";
    const lab = document.getElementById("theme-lab");
    if(lab) lab.textContent = dark ? "Light Mode" : "Dark Mode";
    else btn.textContent = dark ? "Light Mode" : "Dark Mode";
    btn.title = "Switch to " + (dark ? "light" : "dark") + " mode";
  }
  btn.addEventListener("click", function(){
    document.documentElement.setAttribute("data-theme", cur() === "dark" ? "light" : "dark");
    paint();
    try{ localStorage.setItem("mismo.portal.theme", cur()); }catch(e){}
    window.dispatchEvent(new Event("resize"));
  });
  try{
    var saved = localStorage.getItem("mismo.portal.theme");
    if(saved) document.documentElement.setAttribute("data-theme", saved);
  }catch(e){}
  /* No saved choice: write down what the computer is using, so the shared sign-in
     and account menu (which read data-theme) match the page. Not saved. */
  if(!document.documentElement.getAttribute("data-theme")) document.documentElement.setAttribute("data-theme", cur());
  paint();
})();
</script>

</body>
</html>
